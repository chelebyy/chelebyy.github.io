name: Dependabot Patch Auto-Merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-patch-policy:
    name: Dependabot Patch Policy
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate patch auto-merge policy
        id: policy
        shell: bash
        env:
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency-type }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          eligible=false
          reason="manual review required"

          if [[ "$PACKAGE_ECOSYSTEM" != "npm" ]]; then
            reason="only npm updates are eligible"
          elif [[ "$UPDATE_TYPE" != "version-update:semver-patch" ]]; then
            reason="only semantic-version patch updates are eligible"
          elif [[ "$DEPENDENCY_TYPE" == "direct:development" ]]; then
            reason="direct development tooling requires manual review"
          elif [[ "$DEPENDENCY_NAMES" == *,* ]]; then
            reason="grouped dependency updates require manual review"
          elif [[ "$DEPENDENCY_NAMES" == "react" || "$DEPENDENCY_NAMES" == "react-dom" ]]; then
            reason="core React updates require manual review"
          else
            eligible=true
            reason="single-package npm patch update passed the policy"
          fi

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "::notice title=Dependabot patch policy::$reason"

      - name: Enable squash auto-merge
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
